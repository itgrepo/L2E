version: '3.8'

services:
  db:
    image: mariadb:10.5
    container_name: datax_db_3001
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-datax_db_3001}
      MYSQL_USER: ${MYSQL_USER:-astro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password123}
    ports:
      - "${MYSQL_PORT_EXTERNAL:-3311}:3306"
    volumes:
      - datax_db_3001_data:/var/lib/mysql
    networks:
      - datax-network-3001

  backend:
    platform: linux/amd64
    build: ./backendold/Astro_backend
    container_name: datax_backend_3001
    depends_on:
      - db
    ports:
      - "${BACKEND_PORT_EXTERNAL:-3011}:7000"
    volumes:
      - ./backendold/Astro_backend/app:/app
      - ./backendold/Astro_backend/uploads:/app/uploads
    environment:
      - DB_HOST=db
      - DB_USER=${MYSQL_USER:-astro}
      - DB_PASS=${MYSQL_PASSWORD:-password123}
      - DB_NAME=${MYSQL_DATABASE:-datax_db_3001}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_USERNAME=${MAIL_USERNAME:-learn2earn@bde.go.th}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-inljvvpjdtsvglwn}
      - MAIL_USE_SSL=${MAIL_USE_SSL:-true}
      - MAIL_FROM=${MAIL_FROM:-DEX Data Exchange <learn2earn@bde.go.th>}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
    restart: always
    networks:
      - datax-network-3001

  frontend:
    platform: linux/amd64
    build: ./frontend
    container_name: datax_frontend_3001
    ports:
      - "${FRONTEND_PORT_EXTERNAL:-3001}:80"
      - "${FRONTEND_PORT_SSL:-443}:443"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_PATH:-./demo_ssl/server.crt}:/etc/nginx/ssl/server.crt:ro
      - ${SSL_KEY_PATH:-./demo_ssl/server.key}:/etc/nginx/ssl/server.key:ro
    restart: always
    networks:
      - datax-network-3001

  mailhog:
    image: mailhog/mailhog
    container_name: datax_mailhog_3001
    ports:
      - "1027:1025"
      - "8027:8025"
    networks:
      - datax-network-3001

volumes:
  datax_db_3001_data:

networks:
  datax-network-3001:
    driver: bridge
