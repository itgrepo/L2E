version: '3.8'

services:
  db:
    image: mariadb:10.5
    container_name: astro_db_uat
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-psu_backend}
      MYSQL_USER: ${MYSQL_USER:-astro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password123}
    ports:
      - "${MYSQL_PORT_EXTERNAL:-3307}:3306"
    volumes:
      - db_data_uat:/var/lib/mysql
    networks:
      - learn-to-earn-network-uat

  backend:
    image: intelligist-datax-backend:prod
    container_name: astro_backend_uat
    depends_on:
      - db
    ports:
      - "${BACKEND_PORT_EXTERNAL:-3010}:7000"
    volumes:
      # Use a named volume for persistent user uploads, no source code mounted.
      - uploads_data_uat:/app/uploads
    environment:
      - DB_HOST=db
      - DB_USER=${MYSQL_USER:-astro}
      - DB_PASS=${MYSQL_PASSWORD:-password123}
      - DB_NAME=${MYSQL_DATABASE:-psu_backend}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_USERNAME=${MAIL_USERNAME:-learn2earn@bde.go.th}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-inljvvpjdtsvglwn}
      - MAIL_USE_SSL=${MAIL_USE_SSL:-true}
      - MAIL_FROM=${MAIL_FROM:-Data Exchange <learn2earn@bde.go.th>}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
    restart: always
    networks:
      - learn-to-earn-network-uat

  frontend:
    image: intelligist-datax-frontend:prod
    container_name: astro_frontend_uat
    ports:
      - "${FRONTEND_PORT_EXTERNAL:-3001}:80"
      - "443:443"
    depends_on:
      - backend
    restart: always
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_PATH:-/dev/null}:/etc/nginx/ssl/server.crt:ro
      - ${SSL_KEY_PATH:-/dev/null}:/etc/nginx/ssl/server.key:ro
    networks:
      - learn-to-earn-network-uat

  mailhog:
    image: mailhog/mailhog
    container_name: astro_mailhog_uat
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - learn-to-earn-network-uat

volumes:
  db_data_uat:
  uploads_data_uat:

networks:
  learn-to-earn-network-uat:
    driver: bridge
