version: '3.8'

services:
  db:
    image: mariadb:10.5
    container_name: datax_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-datax_db}
      MYSQL_USER: ${MYSQL_USER:-astro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password123}
    ports:
      - "3309:3306"
    volumes:
      - datax_db_data:/var/lib/mysql
    networks:
      - datax-network

  backend:
    platform: linux/amd64
    build: ./backendold/Astro_backend
    container_name: datax_backend
    depends_on:
      - db
    ports:
      - "3015:7000"
    volumes:
      - ./backendold/Astro_backend/app:/app
      - ./backendold/Astro_backend/uploads:/app/uploads
    environment:
      - DB_HOST=db
      - DB_USER=${MYSQL_USER:-astro}
      - DB_PASS=${MYSQL_PASSWORD:-password123}
      - DB_NAME=${MYSQL_DATABASE:-datax_db}
      - MAIL_SERVER=${MAIL_SERVER:-outgoing.workd.go.th}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_USERNAME=${MAIL_USERNAME:-learn2earn@bde.go.th}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-L2E@Start2026!}
      - MAIL_USE_SSL=${MAIL_USE_SSL:-true}
      - MAIL_FROM=${MAIL_FROM:-"L2E Data Exchange <learn2earn@bde.go.th>"}
      - FRONTEND_URL=http://110.78.210.129:3005
    restart: always
    networks:
      - datax-network

  frontend:
    platform: linux/amd64
    build: ./frontend
    container_name: datax_frontend
    ports:
      - "3005:80"
    depends_on:
      - backend
    restart: always
    networks:
      - datax-network

  mailhog:
    image: mailhog/mailhog
    container_name: datax_mailhog
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - datax-network

volumes:
  datax_db_data:

networks:
  datax-network:
    driver: bridge
