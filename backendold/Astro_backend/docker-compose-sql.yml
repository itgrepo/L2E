version: '2'
services:
  mysql:
    image: nexus.alm.set:5000/mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=SET#Admin
      - TZ=Asia/Bangkok
    ports:
      - "3306:3306"
    volumes:
      - /mnt/network_drive/mysql/data:/var/lib/mysql
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.10.0/24
